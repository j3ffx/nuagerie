name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the privacy check inspects every commit identity.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Privacy check (no private file or identity tracked)
        run: npm run check:private

      - name: Commit messages (Conventional Commits)
        run: >-
          node scripts/check-commits.mjs
          ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode, phone screen)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
