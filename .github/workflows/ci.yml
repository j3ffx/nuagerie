name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the privacy check inspects every commit identity.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Privacy check (no private file or identity tracked)
        run: npm run check:private

      - name: Commit messages (Conventional Commits)
        run: >-
          node scripts/check-commits.mjs
          ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode, phone screen)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    # Only after every check passed: main goes to production, other branches to
    # <branch>.<project>.pages.dev.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # No install scripts here: this job holds the Cloudflare token, and a compromised
      # dependency's script could leave a process behind to read it.
      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          # Not a secret (it ships in the bundle), but kept out of the repository.
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          # The app's own address, once it has one: the pages.dev one then sends people there.
          VITE_HOME_URL: ${{ vars.VITE_HOME_URL }}

      - name: Check what will be published
        run: npm run check:dist

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials are not configured: deployment skipped (see docs/SETUP.md)."
            exit 0
          fi
          npx wrangler pages deploy dist --project-name nuagerie \
            --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
